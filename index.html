<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0} :root{--bg:#070a12;--panel:rgba(16,21,35,.78);--panel2:rgba(22,29,48,.86);--line:rgba(148,163,184,.16);--text:#eef2ff;--muted:#94a3b8;--cyan:#67e8f9;--blue:#60a5fa;--violet:#a78bfa;--green:#4ade80;--shadow:0 25px 70px rgba(0,0,0,.38)}
html{background:var(--bg)}body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 10%,rgba(96,165,250,.13),transparent 28%),radial-gradient(circle at 85% 20%,rgba(167,139,250,.13),transparent 30%),linear-gradient(145deg,#060811,#0a1020 55%,#080b16);padding:28px;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(to bottom,black,transparent 90%);z-index:-1}
button,input{font:inherit}.container{max-width:1120px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(18px);animation:panelIn .8s cubic-bezier(.2,.8,.2,1)}
.header{position:relative;padding:30px 30px 24px;background:linear-gradient(135deg,rgba(30,41,70,.82),rgba(20,27,48,.62));border-bottom:1px solid var(--line);overflow:hidden}.header:after{content:"";position:absolute;width:360px;height:360px;right:-150px;top:-210px;border-radius:50%;background:radial-gradient(circle,rgba(103,232,249,.22),transparent 65%);pointer-events:none}.header h1{font-size:28px;letter-spacing:.02em;margin-bottom:7px}.header-subtitle{font-size:13px;color:#aebbd0}.breadcrumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:20px;position:relative;z-index:1}.breadcrumb button{border:1px solid transparent;background:rgba(255,255,255,.055);color:#cbd5e1;padding:7px 10px;border-radius:8px;cursor:pointer;transition:.2s}.breadcrumb button:hover{background:rgba(103,232,249,.11);border-color:rgba(103,232,249,.25);color:#fff;transform:translateY(-1px)}.breadcrumb .current{font-weight:600;color:#fff;background:rgba(103,232,249,.13);border-color:rgba(103,232,249,.2)}.separator{color:#64748b}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;padding:16px 22px;border-bottom:1px solid var(--line);background:rgba(8,12,23,.42)}.btn{position:relative;border:1px solid rgba(148,163,184,.18);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:13px;font-weight:650;color:#dbeafe;background:rgba(255,255,255,.045);transition:transform .18s,background .18s,border-color .18s,box-shadow .18s;overflow:hidden}.btn:hover:not(:disabled){transform:translateY(-2px);background:rgba(255,255,255,.09);border-color:rgba(103,232,249,.28);box-shadow:0 8px 25px rgba(0,0,0,.18)}.btn:active:not(:disabled){transform:scale(.96)}.btn:disabled{opacity:.4;cursor:not-allowed}.btn-primary{background:linear-gradient(135deg,#2563eb,#7c3aed);border-color:rgba(129,140,248,.45);color:white}.btn-success{background:linear-gradient(135deg,#059669,#0ea5e9);border-color:rgba(74,222,128,.35);color:white}.content{padding:0 22px 28px}.status{display:flex;align-items:center;min-height:54px;padding:12px 4px;color:var(--muted);font-size:13px}.status.error{color:#fca5a5}.file-list{list-style:none;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(3,7,18,.22)}.file-item{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:68px;border-bottom:1px solid rgba(148,163,184,.09);animation:itemIn .42s both;transition:background .2s,transform .2s,box-shadow .2s}.file-item:last-child{border-bottom:0}.file-item:hover{background:linear-gradient(90deg,rgba(96,165,250,.075),rgba(167,139,250,.045));transform:translateX(3px);box-shadow:inset 3px 0 0 rgba(103,232,249,.55)}.file-info{display:flex;align-items:center;gap:12px;min-width:0;flex:1}.file-icon{width:34px;text-align:center;font-size:20px;flex-shrink:0;filter:drop-shadow(0 0 8px rgba(103,232,249,.15));transition:transform .25s}.file-item:hover .file-icon{transform:scale(1.15) rotate(-4deg)}.file-name,.folder-link,.image-link{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:520}.file-name{color:#dbe4f3}.folder-link,.image-link{border:0;background:none;color:#7dd3fc;cursor:pointer;text-align:left}.folder-link:hover,.image-link:hover{text-decoration:underline;color:#a5f3fc}.file-meta{font-size:12px;color:#64748b;margin-left:8px;white-space:nowrap}.actions{display:flex;gap:7px;flex-shrink:0}.actions .btn{padding:7px 10px;font-size:12px}.empty-state{text-align:center;padding:64px 20px;color:#64748b}
.config-btn{position:fixed;right:28px;bottom:28px;width:54px;height:54px;border:1px solid rgba(103,232,249,.25);border-radius:50%;background:rgba(15,23,42,.82);color:#e0f2fe;font-size:21px;cursor:pointer;box-shadow:0 10px 35px rgba(0,0,0,.35),0 0 25px rgba(96,165,250,.1);z-index:1000;transition:.25s}.config-btn:hover{transform:rotate(25deg) scale(1.08);box-shadow:0 12px 40px rgba(0,0,0,.45),0 0 30px rgba(103,232,249,.2)}
.modal{display:none;position:fixed;inset:0;background:rgba(2,6,23,.72);z-index:2000;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(10px)}.modal.active{display:flex;animation:fadeIn .22s}.modal-content{background:linear-gradient(145deg,rgba(20,28,48,.97),rgba(10,15,28,.98));border:1px solid rgba(148,163,184,.17);border-radius:17px;width:100%;max-width:620px;max-height:90vh;overflow:auto;box-shadow:0 30px 90px rgba(0,0,0,.55);animation:modalIn .28s cubic-bezier(.2,.8,.2,1)}.modal-header{display:flex;align-items:center;justify-content:space-between;padding:19px 22px;border-bottom:1px solid var(--line)}.modal-header h2{font-size:19px}.close-btn{border:0;background:none;color:#94a3b8;font-size:27px;line-height:1;cursor:pointer;transition:.2s}.close-btn:hover{color:#fff;transform:rotate(90deg)}.modal-body{padding:22px}.modal-footer{display:flex;justify-content:flex-end;gap:9px;padding:15px 22px;background:rgba(2,6,23,.25);border-top:1px solid var(--line)}.input-group{margin-bottom:20px}.input-group label{display:block;margin-bottom:8px;font-size:13px;font-weight:700}.input-group input{width:100%;padding:11px 12px;border:1px solid rgba(148,163,184,.2);border-radius:9px;outline:none;background:rgba(255,255,255,.045);color:#e5e7eb}.input-group input:focus{border-color:rgba(103,232,249,.55);box-shadow:0 0 0 3px rgba(34,211,238,.09)}.help-text{font-size:12px;color:#64748b;margin-top:7px;line-height:1.5}.upload-target{border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.035);padding:12px 14px}.upload-target-label{font-size:11px;color:#64748b;margin-bottom:5px}.upload-target-path{font-size:14px;font-weight:600;word-break:break-all;color:#bae6fd}.drop-zone{border:2px dashed rgba(148,163,184,.25);border-radius:13px;background:rgba(255,255,255,.025);padding:30px 20px;text-align:center;transition:.2s}.drop-zone.dragover{border-color:#67e8f9;background:rgba(103,232,249,.07);transform:scale(1.01)}.drop-icon{font-size:35px;margin-bottom:8px}.drop-title{font-size:15px;font-weight:700}.drop-desc{font-size:12px;color:#64748b;margin:6px 0 15px}.file-picker{display:none}.selected-file{margin-top:12px;padding:9px 11px;border-radius:8px;background:rgba(96,165,250,.08);color:#bae6fd;font-size:13px;word-break:break-all;display:none}.selected-file.show{display:block;animation:itemIn .25s}.upload-progress{height:6px;border-radius:99px;background:rgba(148,163,184,.14);overflow:hidden;margin-top:14px;display:none}.upload-progress.show{display:block}.upload-progress-bar{height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#818cf8,#c084fc);transition:width .2s}
.preview-modal .modal-content{max-width:1000px;width:min(96vw,1000px);background:#090d18;color:#fff;overflow:hidden}.preview-modal .modal-header{border-bottom:1px solid #1f2937}.preview-body{padding:18px;min-height:260px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(96,165,250,.08),transparent 60%),#050914}.preview-image{display:block;max-width:100%;max-height:70vh;width:auto;height:auto;object-fit:contain;border-radius:7px;box-shadow:0 20px 60px rgba(0,0,0,.45);animation:imageIn .35s}.preview-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;background:#090d18}.preview-info{font-size:12px;color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.preview-actions{display:flex;gap:8px;flex-shrink:0}.preview-actions .btn{background:#eef2ff;color:#111827;border-color:transparent}.preview-actions .btn:hover{background:#fff}
.cursor-dot,.cursor-ring,.click-ripple{position:fixed;pointer-events:none;z-index:9999;border-radius:50%;transform:translate(-50%,-50%)}.cursor-dot{width:6px;height:6px;background:#a5f3fc;box-shadow:0 0 14px #22d3ee,0 0 30px rgba(34,211,238,.5);transition:transform .08s}.cursor-ring{width:34px;height:34px;border:1px solid rgba(103,232,249,.55);box-shadow:0 0 22px rgba(96,165,250,.14);transition:width .2s,height .2s,border-color .2s,background .2s}.cursor-ring.hover{width:58px;height:58px;border-color:rgba(167,139,250,.8);background:rgba(167,139,250,.06)}.click-ripple{width:12px;height:12px;border:1px solid rgba(103,232,249,.8);animation:ripple .65s ease-out forwards}
@keyframes panelIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}@keyframes itemIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes modalIn{from{opacity:0;transform:translateY(15px) scale(.97)}to{opacity:1;transform:none}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes imageIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}@keyframes ripple{to{width:110px;height:110px;opacity:0}}
@media(max-width:700px){body{padding:8px}.container{border-radius:16px}.header{padding:22px 18px}.header h1{font-size:24px}.toolbar{padding:12px}.content{padding:0 10px 16px}.file-item{align-items:flex-start;padding:12px}.file-meta{display:none}.actions{flex-wrap:wrap;justify-content:flex-end}.config-btn{right:16px;bottom:16px}.preview-body{padding:10px}.preview-image{max-height:65vh}.preview-footer{align-items:flex-start;flex-direction:column}.preview-actions{width:100%;flex-wrap:wrap}.cursor-dot,.cursor-ring{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<body>
<div class="cursor-dot" id="cursorDot"></div><div class="cursor-ring" id="cursorRing"></div>
<div class="container"><div class="header"><h1>文件导航器</h1><div class="header-subtitle">浏览、预览、下载和上传 GitHub 仓库中的文件</div><div class="breadcrumb" id="breadcrumb"></div></div>
<div class="toolbar"><button class="btn btn-secondary" id="upBtn" type="button">上一级</button><button class="btn btn-secondary" id="refreshBtn" type="button">刷新</button><button class="btn btn-success" id="uploadToolbarBtn" type="button">上传文件</button></div>
<div class="content"><div class="status" id="status">正在读取 GitHub 仓库...</div><ul class="file-list" id="fileList"></ul></div></div>
<button class="config-btn" id="configBtn" type="button" title="配置上传密钥">&#x2699;&#xFE0F;</button>
<div class="modal" id="configModal"><div class="modal-content"><div class="modal-header"><h2>上传配置</h2><button class="close-btn" data-close="configModal" type="button">&times;</button></div><div class="modal-body"><div class="input-group"><label>Cloudflare Worker</label><input value="https://jxmm52547-github-io.12508382508391.workers.dev" readonly><p class="help-text">上传接口已固定，不需要修改。</p></div><div class="input-group"><label for="uploadKeyInput">上传密钥</label><input id="uploadKeyInput" type="password" placeholder="填写 Cloudflare Worker 的 UPLOAD_KEY" autocomplete="off"><p class="help-text">密钥只保存在当前浏览器会话中。</p></div></div><div class="modal-footer"><button class="btn btn-secondary" data-close="configModal" type="button">取消</button><button class="btn btn-primary" id="saveConfigBtn" type="button">保存配置</button></div></div></div>
<div class="modal" id="uploadModal"><div class="modal-content"><div class="modal-header"><h2>上传文件</h2><button class="close-btn" data-close="uploadModal" type="button">&times;</button></div><div class="modal-body"><div class="input-group"><label>上传到</label><div class="upload-target"><div class="upload-target-label">当前目标目录</div><div class="upload-target-path" id="uploadTargetPath">/</div></div></div><div class="drop-zone" id="dropZone"><div class="drop-icon">&#x1F4C1;</div><div class="drop-title">选择要上传的文件</div><div class="drop-desc">支持点击选择或拖放，单个文件最大 50 MB</div><input class="file-picker" id="fileInput" type="file"><button class="btn btn-primary" id="chooseFileBtn" type="button">选择文件</button><div class="selected-file" id="selectedFile"></div></div><div class="upload-progress" id="uploadProgress"><div class="upload-progress-bar" id="uploadProgressBar"></div></div><div class="status" id="uploadStatus"></div></div><div class="modal-footer"><button class="btn btn-secondary" data-close="uploadModal" type="button">取消</button><button class="btn btn-success" id="uploadBtn" type="button">开始上传</button></div></div></div>
<div class="modal preview-modal" id="previewModal"><div class="modal-content"><div class="modal-header"><h2 id="previewTitle">图片预览</h2><button class="close-btn" data-close="previewModal" type="button">&times;</button></div><div class="preview-body"><img class="preview-image" id="previewImage" alt="图片预览"></div><div class="preview-footer"><div class="preview-info" id="previewInfo"></div><div class="preview-actions"><a class="btn" id="previewOpenBtn" target="_blank" rel="noopener">新窗口打开</a><button class="btn" id="previewCopyBtn" type="button">复制地址</button><a class="btn" id="previewDownloadBtn" download>下载</a></div></div></div></div>
<script>
const OWNER='jxmm52547',REPO='jxmm52547.github.io',BRANCH='main',API_ROOT=`https://api.github.com/repos/${OWNER}/${REPO}/contents`,UPLOAD_API='https://jxmm52547-github-io.12508382508391.workers.dev';let currentPath='',uploadKey=sessionStorage.getItem('uploadKey')||'',selectedFile=null;const $=id=>document.getElementById(id),encodePath=p=>p.split('/').filter(Boolean).map(encodeURIComponent).join('/'),pageUrl=p=>`${location.origin}/${encodePath(p)}`,isImage=p=>/\.(avif|bmp|gif|jpe?g|png|svg|webp|ico|tiff?)$/i.test(p);
function parts(p){return p.split('/').filter(Boolean)}function icon(x){return x.type==='dir'?'&#x1F4C1;':isImage(x.name)?'&#x1F5BC;&#xFE0F;':'&#x1F4C4;'}function formatSize(n){if(!Number.isFinite(n))return'';if(n<1024)return`${n} B`;if(n<1048576)return`${(n/1024).toFixed(1)} KB`;return`${(n/1048576).toFixed(1)} MB`}
function updateBreadcrumb(){const r=document.createElement('button');r.type='button';r.textContent='根目录';r.className=currentPath?'':'current';r.onclick=()=>loadDirectory('');const f=document.createDocumentFragment();f.append(r);let p='';parts(currentPath).forEach((part,i,all)=>{const s=document.createElement('span');s.className='separator';s.textContent='/';f.append(s);p+=(p?'/':'')+part;const b=document.createElement('button');b.type='button';b.textContent=part;b.className=i===all.length-1?'current':'';const target=p;b.onclick=()=>loadDirectory(target);f.append(b)});$('breadcrumb').replaceChildren(f);$('upBtn').disabled=!currentPath}
async function loadDirectory(path=''){currentPath=String(path).replace(/^\/+|\/+$/g,'');updateBreadcrumb();$('status').textContent='正在读取 GitHub 仓库...';$('status').className='status';$('fileList').innerHTML='<li class="empty-state">正在加载...</li>';try{const u=`${API_ROOT}${currentPath?'/'+encodePath(currentPath):''}?ref=${encodeURIComponent(BRANCH)}`,r=await fetch(u,{headers:{Accept:'application/vnd.github+json'}}),d=await r.json().catch(()=>null);if(!r.ok)throw Error(`GitHub API ${r.status}${d?.message?'：'+d.message:''}`);if(!Array.isArray(d))throw Error('该路径不是目录');render(d);$('status').textContent=`${d.length} 个项目 · ${currentPath?'/'+currentPath:'/'}`}catch(e){$('status').textContent=`读取失败：${e.message}`;$('status').className='status error';$('fileList').innerHTML='<li class="empty-state">无法读取此目录。请点击“刷新”重试。</li>'}}
function render(items){const dirs=items.filter(x=>x.type==='dir').sort((a,b)=>a.name.localeCompare(b.name,'zh-CN')),files=items.filter(x=>x.type==='file').sort((a,b)=>a.name.localeCompare(b.name,'zh-CN')),f=document.createDocumentFragment();if(!items.length){const li=document.createElement('li');li.className='empty-state';li.textContent='此目录为空';f.append(li)}dirs.concat(files).forEach(x=>f.append(makeItem(x)));$('fileList').replaceChildren(f);[...$('fileList').children].forEach((el,i)=>el.style.animationDelay=`${Math.min(i*25,300)}ms`)}
function makeItem(x){const li=document.createElement('li');li.className='file-item';const info=document.createElement('div');info.className='file-info';const ic=document.createElement('span');ic.className='file-icon';ic.innerHTML=icon(x);info.append(ic);const n=document.createElement('button');n.type='button';n.className=x.type==='dir'?'folder-link':isImage(x.name)?'image-link':'file-name';n.textContent=x.name;if(x.type==='dir')n.onclick=()=>loadDirectory(x.path);else if(isImage(x.name))n.onclick=()=>openPreview(x);else n.onclick=()=>window.open(pageUrl(x.path),'_blank','noopener');const m=document.createElement('span');m.className='file-meta';m.textContent=x.type==='dir'?'目录':formatSize(x.size);info.append(n,m);li.append(info);const a=document.createElement('div');a.className='actions';if(x.type==='file'&&isImage(x.name)){const p=document.createElement('button');p.className='btn btn-primary';p.type='button';p.textContent='预览';p.onclick=()=>openPreview(x);a.append(p)}if(x.type==='file'){const d=document.createElement('a');d.className='btn btn-secondary';d.textContent='下载';d.href=x.download_url||pageUrl(x.path);d.target='_blank';d.rel='noopener';d.download=x.name;a.append(d);const c=document.createElement('button');c.className='btn btn-secondary';c.type='button';c.textContent='复制地址';c.onclick=()=>copyText(x.download_url||pageUrl(x.path));a.append(c)}li.append(a);return li}
async function copyText(t){try{await navigator.clipboard.writeText(t);alert('地址已复制')}catch{prompt('请手动复制地址：',t)}}function openPreview(x){const u=x.download_url||`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${encodePath(x.path)}`;$('previewTitle').textContent=x.name;$('previewInfo').textContent=`${x.path} · ${formatSize(x.size)}`;$('previewImage').src=u;$('previewImage').alt=x.name;$('previewOpenBtn').href=u;$('previewDownloadBtn').href=u;$('previewDownloadBtn').download=x.name;$('previewCopyBtn').onclick=()=>copyText(u);$('previewImage').onerror=()=>{$('previewInfo').textContent='图片加载失败，可能是文件尚未发布或地址不可访问。'};$('previewModal').classList.add('active')}
function closeModal(id){$(id).classList.remove('active')}function openUpload(){if(!uploadKey){$('configModal').classList.add('active');return}$('uploadTargetPath').textContent=currentPath?'/'+currentPath:'/（根目录）';$('uploadStatus').textContent='';$('uploadModal').classList.add('active')}function selectFile(f){selectedFile=f;if(!f){$('selectedFile').classList.remove('show');return}$('selectedFile').textContent=`${f.name} · ${formatSize(f.size)}`;$('selectedFile').classList.add('show')}
async function upload(){if(!selectedFile)return alert('请先选择文件');if(selectedFile.size>50*1024*1024)return alert('文件超过 50 MB 限制');if(!uploadKey){closeModal('uploadModal');$('configModal').classList.add('active');return}const path=currentPath?`${currentPath}/${selectedFile.name}`:selectedFile.name,fd=new FormData();fd.append('file',selectedFile);fd.append('path',path);fd.append('branch',BRANCH);$('uploadBtn').disabled=true;$('uploadProgress').classList.add('show');$('uploadProgressBar').style.width='10%';$('uploadStatus').textContent='正在上传...';try{const r=await fetch(UPLOAD_API,{method:'POST',headers:{Authorization:`Bearer ${uploadKey}`},body:fd}),d=await r.json().catch(()=>({}));$('uploadProgressBar').style.width='90%';if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);$('uploadProgressBar').style.width='100%';$('uploadStatus').textContent='上传成功，正在刷新目录...';setTimeout(()=>{closeModal('uploadModal');$('uploadProgress').classList.remove('show');$('uploadProgressBar').style.width='0';selectFile(null);$('fileInput').value='';$('uploadBtn').disabled=false;loadDirectory(currentPath)},450)}catch(e){$('uploadStatus').textContent=`上传失败：${e.message}`;$('uploadBtn').disabled=false}}
$('upBtn').onclick=()=>{const p=parts(currentPath);p.pop();loadDirectory(p.join('/'))};$('refreshBtn').onclick=()=>loadDirectory(currentPath);$('uploadToolbarBtn').onclick=openUpload;$('configBtn').onclick=()=>{$('uploadKeyInput').value=uploadKey;$('configModal').classList.add('active')};$('saveConfigBtn').onclick=()=>{uploadKey=$('uploadKeyInput').value.trim();uploadKey?sessionStorage.setItem('uploadKey',uploadKey):sessionStorage.removeItem('uploadKey');closeModal('configModal')};$('chooseFileBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>selectFile(e.target.files[0]);$('uploadBtn').onclick=upload;$('dropZone').ondragover=e=>{e.preventDefault();$('dropZone').classList.add('dragover')};$('dropZone').ondragleave=()=>$('dropZone').classList.remove('dragover');$('dropZone').ondrop=e=>{e.preventDefault();$('dropZone').classList.remove('dragover');selectFile(e.dataTransfer.files[0])};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)closeModal(m.id)});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal.active').forEach(m=>closeModal(m.id))});$('previewImage').ondblclick=()=>window.open($('previewImage').src,'_blank','noopener');
const dot=$('cursorDot'),ring=$('cursorRing');let mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my;document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px'});(function cursorLoop(){rx+=(mx-rx)*.16;ry+=(my-ry)*.16;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(cursorLoop)})();document.addEventListener('mouseover',e=>{if(e.target.closest('button,a,.file-item,.drop-zone'))ring.classList.add('hover');else ring.classList.remove('hover')});document.addEventListener('click',e=>{const r=document.createElement('span');r.className='click-ripple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.append(r);setTimeout(()=>r.remove(),700)});document.addEventListener('mouseleave',()=>{dot.style.opacity='0';ring.style.opacity='0'});document.addEventListener('mouseenter',()=>{dot.style.opacity='1';ring.style.opacity='1'});
