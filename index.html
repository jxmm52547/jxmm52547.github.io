<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文件导航器</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f7fb;color:#243447;padding:20px}
    .container{max-width:1100px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.08);overflow:hidden}
    .header{background:#2c3e50;color:#fff;padding:22px 24px}
    .header h1{font-size:24px;margin-bottom:10px}
    .breadcrumb{font-size:14px;color:#dce6ed;word-break:break-all}
    .breadcrumb a{color:#74c0fc;text-decoration:none}.breadcrumb a:hover{text-decoration:underline}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid #eee;background:#fafbfc}
    .content{padding:0 20px 20px}
    .status{padding:14px 4px;color:#68737d;font-size:14px;min-height:46px}
    .file-list{list-style:none;border:1px solid #e5e9ef;border-radius:8px;overflow:hidden}
    .file-item{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 16px;border-bottom:1px solid #edf0f3}
    .file-item:last-child{border-bottom:none}.file-item:hover{background:#f8fafc}
    .file-info{display:flex;align-items:center;min-width:0;flex:1}.file-icon{font-size:20px;margin-right:12px;flex-shrink:0}
    .file-name{font-size:15px;color:#2c3e50;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-name:hover{text-decoration:underline}.folder{color:#2980b9;font-weight:500}
    .actions{display:flex;gap:7px;flex-shrink:0}
    .btn{border:0;border-radius:6px;padding:8px 13px;cursor:pointer;font-size:13px}.btn:disabled{opacity:.55;cursor:not-allowed}
    .btn-primary{background:#3498db;color:#fff}.btn-primary:hover{background:#2980b9}.btn-secondary{background:#eef1f4;color:#34495e}.btn-secondary:hover{background:#dde3e8}.btn-success{background:#27ae60;color:#fff}
    .empty-state{text-align:center;padding:60px 20px;color:#7f8c8d}.error{color:#c0392b}
    .config-btn{position:fixed;right:26px;bottom:26px;width:54px;height:54px;border:0;border-radius:50%;background:#3498db;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:1000}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;align-items:center;justify-content:center;padding:20px}.modal.active{display:flex}
    .modal-content{background:#fff;border-radius:10px;width:100%;max-width:620px;max-height:90vh;overflow:auto}.modal-header{padding:18px 20px;background:#2c3e50;color:#fff;display:flex;justify-content:space-between;align-items:center}.modal-header h2{font-size:19px}.close-btn{background:none;border:0;color:#fff;font-size:28px;cursor:pointer}
    .modal-body{padding:20px}.input-group{margin-bottom:18px}.input-group label{display:block;margin-bottom:7px;font-weight:600;color:#2c3e50}.input-group input{width:100%;padding:10px;border:1px solid #d8dee6;border-radius:6px;font-size:14px}.help-text{font-size:12px;color:#7f8c8d;margin-top:6px;line-height:1.5}
    .modal-footer{padding:16px 20px;background:#f8f9fa;display:flex;justify-content:flex-end;gap:10px}
    .upload-box{border:2px dashed #cfd8e3;border-radius:8px;padding:22px;text-align:center;background:#fbfcfe}.upload-box input{margin:12px auto;display:block}.upload-info{font-size:13px;color:#68737d;line-height:1.6}
    @media(max-width:640px){body{padding:8px}.header{padding:18px}.content{padding:0 10px 14px}.file-item{padding:12px 10px}.actions{gap:4px}.actions .btn{padding:7px 8px}.config-btn{right:16px;bottom:16px}}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>文件导航器</h1>
      <div class="breadcrumb" id="breadcrumb"></div>
    </div>
    <div class="toolbar">
      <button class="btn btn-secondary" id="upBtn" onclick="goUp()">&#x2B06;&#xFE0F; 上一级</button>
      <button class="btn btn-primary" onclick="loadDirectory(currentPath)">&#x1F504; 刷新</button>
      <button class="btn btn-success" onclick="openUploadModal()">&#x2B06;&#xFE0F; 上传文件</button>
    </div>
    <div class="content">
      <div class="status" id="status">正在读取 GitHub 仓库...</div>
      <ul class="file-list" id="fileList"></ul>
    </div>
  </div>

  <button class="config-btn" onclick="openConfigModal()" title="配置上传密钥">&#x2699;&#xFE0F;</button>

  <div class="modal" id="configModal">
    <div class="modal-content">
      <div class="modal-header"><h2>上传配置</h2><button class="close-btn" onclick="closeModal('configModal')">&times;</button></div>
      <div class="modal-body">
        <div class="input-group">
          <label>Cloudflare Worker</label>
          <input type="text" value="https://jxmm52547-github-io.12508382508391.workers.dev" readonly>
          <p class="help-text">上传接口已固定为当前部署的 Worker，不需要再手动填写地址。</p>
        </div>
        <div class="input-group">
          <label for="uploadKeyInput">上传密钥</label>
          <input id="uploadKeyInput" type="password" placeholder="填写 Cloudflare Worker 的 UPLOAD_KEY">
          <p class="help-text">密钥只保存在当前浏览器的会话中，不会写入 GitHub 页面源码。</p>
        </div>
      </div>
      <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('configModal')">取消</button><button class="btn btn-primary" onclick="saveConfig()">保存</button></div>
    </div>
  </div>

  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <div class="modal-header"><h2>上传文件</h2><button class="close-btn" onclick="closeModal('uploadModal')">&times;</button></div>
      <div class="modal-body">
        <div class="input-group"><label>目标目录</label><input id="uploadPathInput" type="text" readonly></div>
        <div class="upload-box">
          <div class="upload-info">选择文件后，文件会上传到当前 GitHub 仓库目录。<br>单个文件限制 50 MB。</div>
          <input id="fileInput" type="file">
          <button class="btn btn-primary" id="uploadBtn" onclick="uploadFile()">开始上传</button>
        </div>
        <div class="status" id="uploadStatus"></div>
      </div>
    </div>
  </div>

  <script>
    const OWNER = 'jxmm52547';
    const REPO = 'jxmm52547.github.io';
    const BRANCH = 'main';
    const API_ROOT = `https://api.github.com/repos/${OWNER}/${REPO}/contents`;
    const UPLOAD_API = 'https://jxmm52547-github-io.12508382508391.workers.dev';
    const baseUrl = window.location.origin;
    let currentPath = '';
    let uploadKey = sessionStorage.getItem('uploadKey') || '';

    const $ = id => document.getElementById(id);
    const encodePath = path => path.split('/').filter(Boolean).map(encodeURIComponent).join('/');
    const pageUrl = path => `${baseUrl}/${encodePath(path)}`;
    const escapeHtml = value => String(value).replace(/[&<>"']/g, c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c]));

    function updateBreadcrumb() {
      const parts = currentPath.split('/').filter(Boolean);
      let html = `<a href="#" onclick="navigateTo('');return false">根目录</a>`;
      let path = '';
      parts.forEach(part => {
        path += (path ? '/' : '') + part;
        html += ` / <a href="#" onclick="navigateTo(${JSON.stringify(path)});return false">${escapeHtml(part)}</a>`;
      });
      $('breadcrumb').innerHTML = html;
      $('upBtn').disabled = !currentPath;
    }

    async function loadDirectory(path = '') {
      currentPath = path.replace(/^\/+|\/+$/g, '');
      updateBreadcrumb();
      $('status').textContent = '正在读取 GitHub 仓库...';
      $('status').className = 'status';
      $('fileList').innerHTML = '';
      try {
        const url = `${API_ROOT}${currentPath ? '/' + encodePath(currentPath) : ''}?ref=${encodeURIComponent(BRANCH)}`;
        const response = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });
        if (!response.ok) throw new Error(`GitHub API ${response.status}`);
        const data = await response.json();
        if (!Array.isArray(data)) throw new Error('该路径不是目录');
        renderItems(data);
        $('status').textContent = `${data.length} 个项目 · ${currentPath || '根目录'}`;
      } catch (error) {
        $('status').textContent = `读取失败：${error.message}`;
        $('status').className = 'status error';
        $('fileList').innerHTML = '<li class="empty-state">无法读取目录，请检查仓库是否公开或稍后重试。</li>';
      }
    }

    function renderItems(items) {
      const folders = items.filter(x => x.type === 'dir').sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
      const files = items.filter(x => x.type === 'file').sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
      if (!items.length) {
        $('fileList').innerHTML = '<li class="empty-state">此目录为空</li>';
        return;
      }
      let html = '';
      folders.forEach(item => {
        html += `<li class="file-item"><div class="file-info"><span class="file-icon">&#x1F4C1;</span><a href="#" class="file-name folder" onclick="navigateTo(${JSON.stringify(item.path)});return false">${escapeHtml(item.name)}</a></div></li>`;
      });
      files.forEach(item => {
        const url = pageUrl(item.path);
        html += `<li class="file-item"><div class="file-info"><span class="file-icon">${getFileIcon(item.name)}</span><a href="${escapeHtml(url)}" class="file-name" target="_blank" rel="noopener">${escapeHtml(item.name)}</a></div><div class="actions"><a class="btn btn-secondary" href="${escapeHtml(url)}" download>下载</a><button class="btn btn-primary" onclick="copyToClipboard(${JSON.stringify(url)}, this)">复制地址</button></div></li>`;
      });
      $('fileList').innerHTML = html;
    }

    function getFileIcon(filename) {
      const ext = filename.includes('.') ? filename.split('.').pop().toLowerCase() : '';
      const map = {
        jpg:'\u{1F5BC}\uFE0F', jpeg:'\u{1F5BC}\uFE0F', png:'\u{1F5BC}\uFE0F', gif:'\u{1F5BC}\uFE0F', webp:'\u{1F5BC}\uFE0F', svg:'\u{1F5BC}\uFE0F',
        mp4:'\u{1F3AC}', avi:'\u{1F3AC}', mov:'\u{1F3AC}', webm:'\u{1F3AC}', pdf:'\u{1F4C4}', txt:'\u{1F4DD}', md:'\u{1F4DD}',
        html:'\u{1F310}', css:'\u{1F3A8}', js:'\u2699\uFE0F', json:'\u{1F527}', zip:'\u{1F4E6}', rar:'\u{1F4E6}', '7z':'\u{1F4E6}'
      };
      return map[ext] || '\u{1F4C4}';
    }

    async function copyToClipboard(text, button) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const area = document.createElement('textarea');
          area.value = text;
          area.style.position = 'fixed';
          area.style.opacity = '0';
          document.body.appendChild(area);
          area.focus();
          area.select();
          document.execCommand('copy');
          area.remove();
        }
        const old = button.textContent;
        button.textContent = '已复制';
        button.classList.add('btn-success');
        setTimeout(() => { button.textContent = old; button.classList.remove('btn-success'); }, 1800);
      } catch (error) {
        alert('复制失败，请手动复制：\n' + text);
      }
    }

    function navigateTo(path) { loadDirectory(path); }

    function goUp() {
      if (!currentPath) return;
      const parts = currentPath.split('/');
      parts.pop();
      loadDirectory(parts.join('/'));
    }

    function openConfigModal() {
      $('uploadKeyInput').value = uploadKey;
      $('configModal').classList.add('active');
    }

    function saveConfig() {
      uploadKey = $('uploadKeyInput').value.trim();
      if (uploadKey) sessionStorage.setItem('uploadKey', uploadKey);
      else sessionStorage.removeItem('uploadKey');
      closeModal('configModal');
      alert(uploadKey ? '上传密钥已保存。' : '已清除上传密钥。');
    }

    function openUploadModal() {
      if (!uploadKey) {
        alert('请先点击右下角 ⚙️ 配置 UPLOAD_KEY。');
        openConfigModal();
        return;
      }
      $('uploadPathInput').value = currentPath || '根目录';
      $('fileInput').value = '';
      $('uploadStatus').textContent = '';
      $('uploadModal').classList.add('active');
    }

    function closeModal(id) { $(id).classList.remove('active'); }

    async function uploadFile() {
      const file = $('fileInput').files[0];
      if (!file) { alert('请选择文件'); return; }
      if (file.size > 50 * 1024 * 1024) { alert('单个文件超过 50 MB，已阻止上传。'); return; }

      const targetPath = currentPath ? `${currentPath}/${file.name}` : file.name;
      const form = new FormData();
      form.append('file', file);
      form.append('path', targetPath);
      form.append('branch', BRANCH);

      const button = $('uploadBtn');
      button.disabled = true;
      $('uploadStatus').textContent = '正在上传...';
      $('uploadStatus').className = 'status';

      try {
        const response = await fetch(UPLOAD_API, {
          method: 'POST',
          headers: { Authorization: `Bearer ${uploadKey}` },
          body: form
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || `上传失败（${response.status}）`);
        $('uploadStatus').textContent = '上传成功，正在刷新目录...';
        await new Promise(resolve => setTimeout(resolve, 500));
        closeModal('uploadModal');
        await loadDirectory(currentPath);
      } catch (error) {
        $('uploadStatus').textContent = '上传失败：' + error.message;
        $('uploadStatus').className = 'status error';
      } finally {
        button.disabled = false;
      }
    }

    window.addEventListener('click', event => {
      if (event.target.classList.contains('modal')) event.target.classList.remove('active');
    });

    loadDirectory('');
  </script>
</body>
</html>
